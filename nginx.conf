events {
    worker_connections 1024;
}

http {
    upstream mydesigners_backend {
        server backend:8000;
        keepalive 64;
    }

    upstream mydesigners_frontend {
        server frontend:80;
        keepalive 32;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name mydesigners.store www.mydesigners.store;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name mydesigners.store www.mydesigners.store;

        ssl_certificate /etc/letsencrypt/live/mydesigners.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mydesigners.store/privkey.pem;

        location /api/ {
            proxy_pass http://mydesigners_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /uploads/ {
            proxy_pass http://mydesigners_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://mydesigners_frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}