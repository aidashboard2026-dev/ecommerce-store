services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres.eizowgupqtyikonkaxqa -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admindash_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-use-a-long-random-string}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@mail.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin1234}
      # Upload directory — MUST match the named volume mount below.
      # Images written here persist in the `product_uploads` Docker named volume.
      # Still used for offer banners (not yet migrated) and any pre-migration
      # legacy product/banner images until migrate_images_to_supabase.py runs.
      UPLOAD_DIR: /app/uploads
      # Supabase Storage — required for product & banner image uploads.
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in your .env file}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in your .env file}
      SUPABASE_PRODUCT_BUCKET: ${SUPABASE_PRODUCT_BUCKET:-product-images}
      SUPABASE_BANNER_BUCKET: ${SUPABASE_BANNER_BUCKET:-banners}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - product_uploads:/app/uploads
    networks:
      - admindash_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api/v1
      # VITE_BACKEND_URL: empty in local dev — Vite proxy routes /uploads → backend:8000.
      # In production, set to the full backend origin: https://api.mystore.com
      - VITE_BACKEND_URL=
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    networks:
      - admindash_network


volumes:
  postgres_data:
  product_uploads:

networks:
  admindash_network:
    driver: bridge