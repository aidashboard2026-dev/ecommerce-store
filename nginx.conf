events {
    worker_connections 1024;
}

http {
    upstream mydesigners_backend {
        least_conn;
        server backend:8000;
        keepalive 64;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name mydesigners.store www.mydesigners.store;

        return 301 https://$host$request_uri;
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        server_name mydesigners.store www.mydesigners.store;

        ssl_certificate /etc/letsencrypt/live/mydesigners.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mydesigners.store/privkey.pem;

        location /api/ {
            proxy_pass http://mydesigners_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}