services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: admindb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d admindb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admindash_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: admindb
      # SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please-use-a-long-random-string}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your .env file}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@mail.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin1234}
      # Upload directory — MUST match the named volume mount below.
      # Images written here persist in the `product_uploads` Docker named volume.
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - product_uploads:/app/uploads
    networks:
      - admindash_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api/v1
      # VITE_BACKEND_URL: empty in local dev — Vite proxy routes /uploads → backend:8000.
      # In production, set to the full backend origin: https://api.mystore.com
      - VITE_BACKEND_URL=
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    networks:
      - admindash_network


volumes:
  postgres_data:
  product_uploads:

networks:
  admindash_network:
    driver: bridge